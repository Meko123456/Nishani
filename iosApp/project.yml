name: Nishani
options:
  bundleIdPrefix: io.github.meko123456
  deploymentTarget:
    iOS: "16.0"
targets:
  Nishani:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.meko123456.nishani
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Nishani
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
    preBuildScripts:
      - name: Build Shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          export JAVA_HOME="${JAVA_HOME:-/Applications/Android Studio.app/Contents/jbr/Contents/Home}"
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode

  NishaniUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Nishani
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.meko123456.nishani.uitests
        # Without this the bundle has no Info.plist and signing fails with a message that
        # blames the signature rather than the missing plist.
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
schemes:
  Nishani:
    build:
      targets:
        Nishani: all
        NishaniUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NishaniUITests
