name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Ubuntu builds the shared Kotlin + Android app; the ios job below covers Kotlin/Native.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build + test shared and Android
        run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug :androidApp:lintDebug --stacktrace

      # Guards the R8 config and release-only lint. Debug never runs the shrinker, so without this
      # a keep-rules mistake first appears when somebody builds a release by hand - and
      # lintVitalRelease is the release-blocking subset of lint, which debug lint does not cover.
      - name: Release build (R8 + release-blocking lint)
        run: ./gradlew :androidApp:assembleRelease :androidApp:lintVitalRelease --stacktrace

  ios:
    # :shared declares iosX64, iosArm64 and iosSimulatorArm64, and nothing here ever built any of
    # them. The old plan was to compile iOS locally, which is not a check: it holds only for as
    # long as someone remembers, and it says nothing about a contributor's branch.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Runs the shared tests on a simulator rather than only compiling them. Compiling proves the
      # code is valid Kotlin/Native; running proves it behaves the same there, which is the whole
      # reason the logic lives in :shared.
      - name: Test the shared code on iOS
        run: |
          # iosArm64 is what a real iPhone links against, and it was declared and published
          # without ever being built. It cannot run tests on a runner, so it is compiled.
          ./gradlew :shared:iosSimulatorArm64Test :shared:compileKotlinIosArm64 --stacktrace

  iosApp:
    # The SwiftUI app gets built, not just the shared framework it links against. The ios job above
    # stops at Kotlin, so every line of Swift under iosApp/ - and the Gradle-to-Xcode wiring the app
    # links through - was checked by nobody. A native UI that nothing compiles rots exactly the way
    # a declared-but-never-built Kotlin target does, which is the failure the ios job was added to
    # fix; leaving the Swift half out just moves the same hole one language over.
    #
    # The project file is generated by XcodeGen from project.yml rather than committed, so running
    # the generator is part of the check: a project.yml that no longer produces a buildable project
    # is the same breakage as a source file that will not compile.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Java is here for Xcode's sake, not Gradle's: the app target's pre-build phase shells out to
      # ./gradlew :shared:embedAndSignAppleFrameworkForXcode to produce Shared.framework.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: iosApp
        run: xcodegen generate

      # A simulator now has to boot, because the tests run on one - but it is chosen rather than
      # named. Runner images change which devices they carry, and a hardcoded "iPhone 16" turns an
      # image update into a red build for no reason.
      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in d for x in d[k] if 'iPhone' in x['name']))")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "using $UDID"

      # `test`, not `build`. Building proved the Swift compiles and that the Kotlin framework is
      # where the Xcode target expects it - which is real, but it is the whole of what it proved.
      # What a note is called, which notes a search matches, what order the list is in and what
      # markdown means are all decided in Kotlin, so a green build says the two languages agree
      # about types and says nothing about whether a keystroke reaches NotesRepository and the
      # answer comes back. The UI tests drive that chain instead.
      - name: Build and test the iOS app
        working-directory: iosApp
        run: |
          xcodebuild test -project Nishani.xcodeproj -scheme Nishani \
                     -sdk iphonesimulator -destination "id=${{ steps.sim.outputs.udid }}" \
                     -configuration Debug
